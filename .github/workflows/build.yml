name: Build Neo Launcher 2.0

# Stavi novy Neo Launcher ze slozky app/. Spousti se pri kazdem pushi
# (na jakoukoliv vetev) a rucne pres "Run workflow". Hotove APK je ke
# stazeni v sekci Artifacts u konkretniho behu a zaroven se zverejni jako
# GitHub Release - odtud si ho stahuje aktualizator primo v launcheru.
on:
  workflow_dispatch:
  # Zmeny jen v dokumentaci nestavi (a hlavne nevytvari novou "aktualizaci").
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# Zapis do repozitare je potreba jen pro vytvoreni Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nastavit Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runnery maji Android SDK predinstalovane (ANDROID_HOME).
      - name: Doinstalovat SDK platformu
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Doplnek "Neo - Meta tlacitko" (sluzba pristupnosti) se postavi prvni a pribali
      # do assets Nea - Neo ho samo nainstaluje (jako Lightning Launcher svuj doplnek).
      - name: Sestavit doplnek Meta tlacitka
        run: |
          chmod +x ./gradlew
          ./gradlew :metaaddon:assembleDebug --stacktrace --no-daemon
          mkdir -p app/src/main/assets
          cp metaaddon/build/outputs/apk/debug/metaaddon-debug.apk app/src/main/assets/meta-addon.apk

      - name: Sestavit APK
        env:
          NEO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Pojmenovat APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/NeoLauncher-2.0.${GITHUB_RUN_NUMBER}.apk"
          cp metaaddon/build/outputs/apk/debug/metaaddon-debug.apk "out/NeoMetaTlacitko-2.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Nahrat APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoLauncher-APK
          path: out/*.apk
          if-no-files-found: error

      # Kazdy build = Release "v2.0.<cislo behu>". Buildy mimo vetev main jsou
      # oznacene jako testovaci (prerelease). Poznamky = zprava commitu.
      - name: Zverejnit jako Release (aktualizace z launcheru)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="2.0.${GITHUB_RUN_NUMBER}"
          CODE=$((2000 + GITHUB_RUN_NUMBER))
          # Opakovany beh stejneho buildu (Re-run) - release uz existuje.
          if gh release view "v${VER}" > /dev/null 2>&1; then
            echo "Release v${VER} uz existuje, preskakuji."
            exit 0
          fi
          PRE=""
          if [ "${GITHUB_REF_NAME}" != "main" ]; then PRE="--prerelease"; fi
          # Poznamky = nejnovejsi sekce z app/src/main/assets/novinky.txt (lidsky psane
          # "co je noveho", stejny text ukaze launcher po aktualizaci). Bez souboru zprava commitu.
          NOVINKY=app/src/main/assets/novinky.txt
          {
            echo "versionCode: ${CODE}"
            echo "vetev: ${GITHUB_REF_NAME}"
            echo
            if [ -s "$NOVINKY" ]; then
              awk 'NR==1 && /^#/ {sub(/^#+ */, ""); print; next} /^#/ {exit} {print}' "$NOVINKY" | head -c 4000
            else
              git log -1 --pretty=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' | head -c 4000
            fi
          } > notes.md
          # Neo jako PRVNI asset (starsi verze aktualizatoru berou prvni .apk), doplnek az potom.
          gh release create "v${VER}" "out/NeoLauncher-${VER}.apk" \
            --title "Neo ${VER}" --notes-file notes.md --target "${GITHUB_SHA}" ${PRE}
          gh release upload "v${VER}" "out/NeoMetaTlacitko-${VER}.apk"

      - name: Nahrat logy pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            metaaddon/build/reports/**
          if-no-files-found: ignore
