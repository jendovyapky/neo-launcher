          PATCH_EOF
          base64 -d neo.patch.b64 > neo.patch
          wc -l neo.patch

      - name: Nasadit Neo upravy
        run: |
          cd src
          git apply --binary --verbose ../neo.patch

      - name: Nastavit Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runnery uz maji Android SDK predinstalovane (ANDROID_HOME
      # je nastavene). Externi akci setup-android nepotrebujeme - je
      # dlouhodobe neudrzovana a casto padala. Jen doinstalujeme
      # konkretni platformu a build-tools, ktere projekt potrebuje.
      - name: Doinstalovat SDK platformu
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Pevný podpisový klíč z GitHub Secrets → nová verze jde nainstalovat jako aktualizace
      # (bez odinstalace a ztráty nastavení). Bez secrets se podepíše jako dřív.
      - name: Podpisovy klic
        env:
          KS: ${{ secrets.NEO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/neo.keystore"
            echo "NEO_KEYSTORE=$RUNNER_TEMP/neo.keystore" >> "$GITHUB_ENV"
            echo "Podepisuju pevnym klicem."
          else
            echo "::warning::Chybi secret NEO_KEYSTORE_B64 - APK bude podepsane nahodnym klicem (nepujde nainstalovat jako aktualizace)."
          fi

      - name: Sestavit hlavni launcher
        env:
          NEO_KEYSTORE_PASSWORD: ${{ secrets.NEO_KEYSTORE_PASSWORD }}
        run: |
          cd src/Launcher
          chmod +x ./gradlew
          ./gradlew assembleSideloadDebug --stacktrace --no-daemon

      # Mala samostatna aplikace, kterou si na Questu volitelne instalujes
      # pres Nastaveni -> Shortcut Settings. Reaguje na drzeni Meta tlacitka
      # / hover nad dock ikonami a otevre spravny launcher - diky patchi
      # ted prioritne Neo Launcher, kdyz je nainstalovany.
      - name: Sestavit Meta tlacitko addon
        run: |
          cd src/RedirectServices
          chmod +x ./gradlew
          ./gradlew assembleNavigatorRelease --stacktrace --no-daemon

      - name: Nahrat APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Launcher-APK
          path: |
            src/Launcher/App/build/outputs/apk/**/*.apk
            src/RedirectServices/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Nahrat logy pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/Launcher/App/build/reports/**
            src/RedirectServices/app/build/reports/**
          if-no-files-found: ignore
