name: Build Neo Launcher APK

# JEDINY soubor, ktery je potreba. Zdrojaky si stahne sam z GitHubu,
# sam na ne nasadi Neo upravy a sam z toho postavi APK - hlavni
# launcher i mensi addon pro Meta tlacitko / dock zkratky.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Presna verze Lightning Launcheru, proti ktere je patch udelany.
      UPSTREAM_SHA: db16663f641516ce8d1e38a6a6623100bf42c7a5

    steps:
      - name: Stahnout Lightning Launcher
        run: |
          git clone https://github.com/threethan/LightningLauncher.git src
          cd src
          git checkout $UPSTREAM_SHA

