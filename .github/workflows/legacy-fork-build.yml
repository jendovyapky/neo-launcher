# stavi pres build.yml ze slozky app/. Tenhle workflow zustava jen kvuli
# addonu pro Meta tlacitko (RedirectServices), ktery otevira Neo Launcher
# - spousti se jen rucne (Actions -> tento workflow -> Run workflow).
